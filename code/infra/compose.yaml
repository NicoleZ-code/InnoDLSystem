name: innodl-power
services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: innodl_system
      POSTGRES_USER: ${POSTGRES_USER:-innodl}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请先运行 pnpm setup 生成环境配置}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - '127.0.0.1:55432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d innodl_system']
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    command:
      [
        'redis-server',
        '--appendonly',
        'yes',
        '--requirepass',
        '${REDIS_PASSWORD:?请配置 REDIS_PASSWORD}',
      ]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$${REDIS_PASSWORD}" ping | grep PONG']
      interval: 5s
      timeout: 3s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-innodl}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?请配置对象存储密码}
    volumes:
      - model-data:/data
  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile
      target: api
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 8787
      DATABASE_URL: postgresql://${POSTGRES_USER:-innodl}:${POSTGRES_PASSWORD}@postgres:5432/innodl_system
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-innodl}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: innodl-models
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:?请配置首次管理员密码}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    volumes:
      - api-data:/app/apps/api-server/data
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:8787/api/v1/health').then(r=>{if(!r.ok)process.exit(1)})",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
  nginx:
    build:
      context: ..
      dockerfile: infra/Dockerfile
      target: nginx
    ports:
      - '8080:80'
    depends_on:
      api:
        condition: service_healthy
volumes:
  postgres-data:
  redis-data:
  model-data:
  api-data:
